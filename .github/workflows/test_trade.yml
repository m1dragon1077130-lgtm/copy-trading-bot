name: Test Trade (BTC)
on:
  workflow_dispatch:

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run Trade Test
        env:
          MASTER_API_KEY: ${{ secrets.MASTER_API_KEY }}
          MASTER_API_SECRET: ${{ secrets.MASTER_API_SECRET }}
        run: python test_trade.py
